<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Opening QR Scan</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: #ffffff;
      }

      body {
        color: #000000;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .handoff {
        display: grid;
        width: min(100%, 480px);
        margin-inline: auto;
        padding: 128px 24px 48px;
        justify-items: center;
        gap: 20px;
        text-align: center;
      }

      .handoffSpinner {
        width: 52px;
        height: 52px;
        border: 5px solid #e6e6e6;
        border-top-color: #000000;
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }

      .handoffText {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
      }

      .handoffLink {
        color: #000000;
        font-size: 16px;
        text-underline-offset: 3px;
      }

      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .handoffSpinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="handoff" aria-live="polite">
      <div class="handoffSpinner" id="handoffSpinner" aria-hidden="true"></div>
      <p class="handoffText" id="handoffText">
        Opening your capture options…
      </p>
      <a class="handoffLink" id="continueLink" href="/app.html">
        Continue
      </a>
    </main>

    <script>
      (() => {
        const destination = new URL("/app.html", window.location.origin);
        destination.search = window.location.search;
        destination.hash = window.location.hash;

        const continueLink = document.getElementById("continueLink");
        const handoffSpinner = document.getElementById("handoffSpinner");
        const handoffText = document.getElementById("handoffText");
        continueLink.href = destination.href;

        /*
         * If the CDN rewrites a missing /app.html back to this bootstrap,
         * stop here instead of creating a navigation loop.
         */
        if (window.location.pathname.endsWith("/app.html")) {
          handoffSpinner.hidden = true;
          handoffText.textContent = "The capture application is unavailable.";
          continueLink.hidden = true;
          return;
        }

        /*
         * This must remain a full-document navigation. Chrome on iOS applies
         * its toolbar insets in the native WebView lifecycle, outside the DOM.
         * Waiting for this bootstrap to be shown and painted ensures the app
         * navigation runs after that first-show lifecycle has completed.
         */
        let navigationScheduled = false;
        let navigationStarted = false;
        let pageShown = false;

        const navigate = () => {
          if (navigationStarted) return;
          navigationStarted = true;
          window.location.replace(destination.href);
        };

        continueLink.addEventListener("click", (event) => {
          event.preventDefault();
          navigate();
        });

        const navigateAfterVisiblePaint = () => {
          if (
            navigationScheduled ||
            navigationStarted ||
            !pageShown ||
            document.visibilityState !== "visible"
          ) {
            return;
          }

          navigationScheduled = true;
          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(() => {
              navigationScheduled = false;
              if (document.visibilityState !== "visible") return;
              navigate();
            });
          });
        };

        window.addEventListener("pageshow", () => {
          pageShown = true;
          navigateAfterVisiblePaint();
        });
        document.addEventListener(
          "visibilitychange",
          navigateAfterVisiblePaint,
        );
      })();
    </script>
  </body>
</html>
