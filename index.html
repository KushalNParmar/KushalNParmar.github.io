<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>GlamAR experience switcher</title>
    <style>
      :root {
        color-scheme: light;
        --control-bg: rgba(19, 20, 23, 0.88);
        --control-border: rgba(255, 255, 255, 0.16);
        --control-text: rgba(255, 255, 255, 0.72);
        --control-active: #fff;
        --accent: #f4f4f4;
        --error: #ffb4ab;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        font-size: 1vw;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        font-family: Inter, sans-serif;
      }

      button {
        font: inherit;
      }

      #GlamAR-module {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .experience-controls {
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        left: 50%;
        z-index: 20;
        display: grid;
        grid-template-columns: repeat(3, minmax(76px, 1fr));
        gap: 4px;
        width: min(340px, calc(100vw - 28px));
        padding: 5px;
        overflow: hidden;
        border: 1px solid var(--control-border);
        border-radius: 999px;
        background: var(--control-bg);
        box-shadow:
          0 14px 38px rgba(0, 0, 0, 0.2),
          inset 0 1px rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        transform: translateX(-50%);
      }

      .experience-button {
        min-height: 38px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--control-text);
        cursor: pointer;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.02em;
        transition:
          color 160ms ease,
          background-color 160ms ease,
          opacity 160ms ease,
          transform 160ms ease;
      }

      .experience-button:hover:not(:disabled) {
        color: var(--control-active);
        transform: translateY(-1px);
      }

      .experience-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .experience-button.is-active {
        background: var(--accent);
        color: #171914;
      }

      .experience-button.is-pending {
        background: rgba(255, 255, 255, 0.12);
        color: var(--control-active);
      }

      .experience-button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      .experience-status {
        position: fixed;
        top: max(68px, calc(env(safe-area-inset-top) + 54px));
        left: 50%;
        z-index: 20;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 7px 11px;
        border-radius: 8px;
        background: rgba(19, 20, 23, 0.82);
        color: #fff;
        font-size: 12px;
        line-height: 1.35;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -4px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .experience-status.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .experience-status.is-error {
        color: var(--error);
      }

      .experience-controls[hidden],
      .experience-status[hidden] {
        display: none;
      }

      .experience-intro {
        position: fixed;
        inset: 0;
        z-index: 6000;
        display: grid;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        overflow: auto;
        place-items: center;
        color: #000;
        background: #fff;
      }

      .experience-intro[hidden] {
        display: none;
      }

      .experience-intro-panel {
        display: grid;
        width: min(100%, 420px);
        gap: 12px;
      }

      .experience-intro-button {
        display: flex;
        width: 100%;
        min-height: 58px;
        padding: 14px 24px;
        align-items: center;
        justify-content: center;
        border: 1.5px solid #000;
        border-radius: 999px;
        color: #000;
        background: #fff;
        cursor: pointer;
        font-size: clamp(16px, 2.2vw, 20px);
        font-weight: 600;
        letter-spacing: 0.01em;
        transition:
          color 160ms ease,
          background-color 160ms ease,
          opacity 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .experience-intro-button[data-intro-experience="makeup"] {
        color: #fff;
        background: #000;
      }

      .experience-intro-button:hover {
        transform: translateY(-1px);
      }

      .experience-intro-button:active {
        transform: scale(0.99);
      }

      .experience-intro-button:focus-visible {
        outline: 3px solid #8d8d8d;
        outline-offset: 3px;
      }

      .centeredLoader {
        position: fixed;
        display: flex;
        width: 100%;
        height: 100%;
        background: var(--layout-background-color);
        justify-content: center;
        align-items: center;
        z-index: 5000;
        background: #fff;
      }

      .centeredLoader[hidden] {
        display: none;
      }

      .lottieContainer {
        display: flex;
        padding: 7.5rem;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.25rem;
        flex-shrink: 0;
      }

      .waveGrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        width: 20rem;
        height: 20rem;
        flex-shrink: 0;
        aspect-ratio: 1 / 1;
      }

      .waveGrid .cell {
        width: 100%;
        height: 100%;
        background: #000;
        transform: scale(0.4);
        transform-origin: center;
        will-change: transform;
        animation: waveScale 1.57s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        box-shadow: 0 0 0 0.5px #000;
      }

      @keyframes waveScale {
        0% {
          transform: scale(0.4);
        }

        21% {
          transform: scale(1);
        }

        53% {
          transform: scale(1);
        }

        75% {
          transform: scale(0.4);
        }

        100% {
          transform: scale(0.4);
        }
      }

      .waveGrid .cell:nth-child(1) {
        animation-delay: 200ms;
      }

      .waveGrid .cell:nth-child(2) {
        animation-delay: 267ms;
      }

      .waveGrid .cell:nth-child(3) {
        animation-delay: 334ms;
      }

      .waveGrid .cell:nth-child(4) {
        animation-delay: 400ms;
      }

      .waveGrid .cell:nth-child(5) {
        animation-delay: 133ms;
      }

      .waveGrid .cell:nth-child(6) {
        animation-delay: 200ms;
      }

      .waveGrid .cell:nth-child(7) {
        animation-delay: 267ms;
      }

      .waveGrid .cell:nth-child(8) {
        animation-delay: 334ms;
      }

      .waveGrid .cell:nth-child(9) {
        animation-delay: 67ms;
      }

      .waveGrid .cell:nth-child(10) {
        animation-delay: 133ms;
      }

      .waveGrid .cell:nth-child(11) {
        animation-delay: 200ms;
      }

      .waveGrid .cell:nth-child(12) {
        animation-delay: 267ms;
      }

      .waveGrid .cell:nth-child(13) {
        animation-delay: 0ms;
      }

      .waveGrid .cell:nth-child(14) {
        animation-delay: 67ms;
      }

      .waveGrid .cell:nth-child(15) {
        animation-delay: 133ms;
      }

      .waveGrid .cell:nth-child(16) {
        animation-delay: 200ms;
      }

      .lottieText {
        margin: 0;
        text-align: center;
        font-size: 3.75rem;
        font-style: normal;
        font-weight: 400;
      }

      #error {
        position: fixed;
        inset: 0;
        z-index: 7000;
        display: none;
        place-items: center;
        padding: 24px;
        background: #fff;
        color: #b42318;
        text-align: center;
        line-height: 1.5;
      }

      #error.is-visible {
        display: grid;
      }

      @media (min-width: 648px) {
        .lottieContainer {
          padding: 3.7rem;
          gap: 0.62rem;
        }

        .waveGrid {
          width: 12.35rem;
          height: 12.35rem;
        }

        .lottieText {
          font-size: 2.16rem;
        }
      }

      @media (min-width: 720px) and (orientation: landscape) {
        .lottieContainer {
          padding: 3.33rem;
          gap: 0.56rem;
        }

        .waveGrid {
          width: 11.11rem;
          height: 11.11rem;
        }

        .lottieText {
          font-size: 1.94rem;
        }
      }

      @media (min-width: 846px) and (orientation: portrait) {
        .lottieContainer {
          padding: 2.84rem;
          gap: 0.47rem;
        }

        .waveGrid {
          width: 14.18rem;
          height: 14.18rem;
        }

        .lottieText {
          font-size: 2.36rem;
        }
      }

      @media (min-width: 1440px) and (orientation: landscape) {
        .lottieContainer {
          padding: 1.67rem;
          gap: 0.28rem;
        }

        .waveGrid {
          width: 8.33rem;
          height: 8.33rem;
        }

        .lottieContainer h4 {
          font-size: 1.39rem;
        }
      }

      @media (min-width: 1080px) and (orientation: portrait) {
        .lottieContainer {
          padding: 2.22rem;
          gap: 0.37rem;
        }

        .waveGrid {
          width: 14.81rem;
          height: 14.81rem;
        }

        .lottieContainer h4 {
          font-size: 2.22rem;
        }
      }

      @media (min-width: 1920px) and (orientation: landscape) {
        .lottieContainer {
          padding: 1.25rem;
          gap: 0.21rem;
        }

        .waveGrid {
          width: 8.33rem;
          height: 8.33rem;
        }

        .lottieContainer h4 {
          font-size: 1.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .experience-button,
        .experience-status,
        .experience-intro-button {
          transition: none;
        }

        .waveGrid .cell {
          animation: none;
          transform: scale(1);
        }
      }
    </style>
    <script src="https://cdn.glamarz0.de/sdk/wrapper?"></script>
  </head>
  <body>
    <main id="GlamAR-module" aria-hidden="true" inert></main>

    <section
      class="experience-intro"
      id="experience-intro"
      aria-label="Choose your experience"
    >
      <div
        class="experience-intro-panel"
        role="group"
        aria-label="Experience"
      >
        <button
          class="experience-intro-button"
          data-intro-experience="makeup"
          type="button"
        >
          VTO
        </button>
        <button
          class="experience-intro-button"
          data-intro-experience="skin"
          type="button"
        >
          Skin Analysis
        </button>
      </div>
    </section>

    <nav
      class="experience-controls"
      aria-label="Switch GlamAR experience"
      aria-hidden="true"
      inert
      hidden
    >
      <button
        class="experience-button is-active"
        data-experience="makeup"
        type="button"
        disabled
      >
        Makeup
      </button>
      <button
        class="experience-button"
        data-experience="hair"
        type="button"
        disabled
      >
        Hair
      </button>
      <button
        class="experience-button"
        data-experience="skin"
        type="button"
        disabled
      >
        Skin
      </button>
    </nav>
    <p
      id="experience-status"
      class="experience-status"
      role="status"
      aria-live="polite"
      hidden
    ></p>

    <div
      class="centeredLoader"
      id="lottieLoader"
      role="status"
      aria-hidden="true"
      inert
      hidden
    >
      <div class="lottieContainer">
        <div class="waveGrid" aria-hidden="true">
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
        </div>
        <h4 class="lottieText">Loading your experience</h4>
      </div>
    </div>
    <div id="error" role="alert" tabindex="-1"></div>

    <script>
      (() => {
        const DEFAULT_API_KEY = "25cd4d7a-fe7d-4fc4-af1b-608414bf0c99";
        const SKIN_ANALYSIS_APP_ID = "0732f85d-5768-462e-a50a-174840438a69";
        const EXPERIENCE_CHANGE_TIMEOUT = 30000;
        const params = new URLSearchParams(window.location.search);
        const accessKey = params.get("accessKey") || DEFAULT_API_KEY;
        const version = params.get("version");
        const debugText = params.get("debug") === "true";
        const cameraSync = params.get("cameraSync");
        const sdkHost = document.getElementById("GlamAR-module");
        const controls = document.querySelector(".experience-controls");
        const lottieLoader = document.getElementById("lottieLoader");
        const error = document.getElementById("error");
        const status = document.getElementById("experience-status");
        const intro = document.getElementById("experience-intro");
        const buttons = Array.from(
          document.querySelectorAll("[data-experience]"),
        );
        const introButtons = Array.from(
          document.querySelectorAll("[data-intro-experience]"),
        );
        const glamar = window.GlamAR;

        let sdkPhase = "booting";
        let sdkLoading = false;
        let firstLoadedHandled = false;
        let introOpen = true;
        let introChoice = null;
        let activeExperience = null;
        let experienceOpen = false;
        let desiredRequest = null;
        let inFlight = null;
        let requestSequence = 0;
        let flowCycle = 0;
        let statusTimer = null;

        const experienceLabels = {
          makeup: "Makeup",
          hair: "Hair",
          skin: "Skin Analysis",
        };

        const experienceCalls = glamar
          ? {
              makeup: () =>
                glamar.setExperience("vto", {
                  category: "makeup",
                }),
              hair: () =>
                glamar.setExperience("vto", {
                  category: "hair",
                }),
              skin: () =>
                glamar.setExperience("skinAnalysis", {
                  appId: SKIN_ANALYSIS_APP_ID,
                }),
            }
          : {};

        const getErrorMessage = (event) => {
          if (typeof event === "string") return event;

          const detail = event?.detail;
          const candidate =
            detail?.error ||
            detail?.message ||
            event?.error ||
            event?.message;

          if (typeof candidate === "string") return candidate;
          return candidate?.message;
        };

        const setInert = (element, value) => {
          if (value) element.setAttribute("inert", "");
          else element.removeAttribute("inert");
        };

        const setLoaderVisible = (visible) => {
          const isExposed = visible && !introOpen;
          lottieLoader.hidden = !isExposed;
          lottieLoader.setAttribute("aria-hidden", String(!isExposed));
          setInert(lottieLoader, !isExposed);
        };

        const setExperienceUiVisible = (
          visible,
          interactive = visible,
        ) => {
          controls.hidden = !visible;
          controls.setAttribute("aria-hidden", String(!interactive));
          setInert(controls, !interactive);
          status.hidden = !visible;
          sdkHost.setAttribute("aria-hidden", String(!interactive));
          setInert(sdkHost, !interactive);
        };

        const showStatus = (message, isError = false, persistent = false) => {
          window.clearTimeout(statusTimer);
          status.textContent = message;
          status.classList.toggle("is-error", isError);
          status.classList.toggle("is-visible", Boolean(message));

          if (message && !persistent) {
            statusTimer = window.setTimeout(() => {
              status.classList.remove("is-visible");
            }, 2200);
          }
        };

        const renderIntroButtons = () => {
          introButtons.forEach((button) => {
            button.disabled = sdkPhase === "fatal";
          });
        };

        const renderButtons = () => {
          const pendingExperience = introOpen ? null : inFlight?.target;
          const disabled =
            introOpen ||
            sdkPhase !== "ready" ||
            sdkLoading ||
            Boolean(inFlight);

          buttons.forEach((button) => {
            const experience = button.dataset.experience;
            button.disabled = disabled;
            button.classList.toggle(
              "is-active",
              experience === activeExperience && !pendingExperience,
            );
            button.classList.toggle(
              "is-pending",
              experience === pendingExperience,
            );
            button.setAttribute(
              "aria-pressed",
              String(experience === activeExperience),
            );
          });
        };

        const showFatalError = (message) => {
          sdkPhase = "fatal";
          flowCycle += 1;

          if (inFlight?.timeoutId) {
            window.clearTimeout(inFlight.timeoutId);
          }

          inFlight = null;
          desiredRequest = null;
          sdkLoading = false;
          setLoaderVisible(false);
          intro.hidden = true;
          intro.setAttribute("aria-hidden", "true");
          setInert(intro, true);
          setExperienceUiVisible(false);
          renderIntroButtons();
          renderButtons();
          error.textContent = message;
          error.classList.add("is-visible");
          window.requestAnimationFrame(() => {
            error.focus({ preventScroll: true });
          });
        };

        const showExperienceView = () => {
          introOpen = false;
          intro.hidden = true;
          intro.setAttribute("aria-hidden", "true");
          setInert(intro, true);
          const isReady = sdkPhase === "ready" && !sdkLoading;
          setExperienceUiVisible(true, isReady);
          setLoaderVisible(!isReady);
          renderButtons();
        };

        const showIntro = () => {
          introOpen = true;
          introChoice = null;
          desiredRequest = null;
          intro.hidden = false;
          intro.removeAttribute("aria-hidden");
          setInert(intro, false);
          setLoaderVisible(false);
          showStatus("");
          setExperienceUiVisible(false);
          renderIntroButtons();
          renderButtons();

          window.requestAnimationFrame(() => {
            introButtons[0]?.focus({ preventScroll: true });
          });
        };

        const matchesExperienceEvent = (event, target) => {
          const detail = event?.detail || event || {};
          const experience = detail.experience;
          const category =
            detail.category ||
            detail.options?.category ||
            detail.configuration?.category ||
            null;

          if (experience === "skinAnalysis" || experience === "skin") {
            return target === "skin";
          }
          if (experience === "makeup" || experience === "hair") {
            return target === experience;
          }
          if (experience === "vto") {
            if (target !== "makeup" && target !== "hair") return false;
            if (category === "makeup" || category === "hair") {
              return target === category;
            }

            // The current GlamAR wrapper reports only the VTO family on a
            // successful change. Requests are serialized locally, so the
            // active Makeup/Hair request identifies the selected category.
            return true;
          }

          return false;
        };

        const completeRequest = (request) => {
          if (
            request.source === "intro" &&
            !introOpen &&
            introChoice === request.target
          ) {
            const activeButton = buttons.find(
              (button) => button.dataset.experience === request.target,
            );
            window.requestAnimationFrame(() => {
              activeButton?.focus({ preventScroll: true });
            });
          } else if (request.source === "pill" && !introOpen) {
            showStatus("Experience switched");
          }
        };

        const failExperienceChange = (requestId, eventOrError) => {
          const request = inFlight;
          if (
            !request ||
            request.id !== requestId ||
            request.cycle !== flowCycle
          ) {
            return;
          }

          window.clearTimeout(request.timeoutId);
          inFlight = null;
          sdkLoading = false;
          setLoaderVisible(false);
          if (!introOpen) setExperienceUiVisible(true, true);

          const message =
            getErrorMessage(eventOrError) || "Experience switch failed";
          const queuedRequest =
            desiredRequest?.cycle === flowCycle ? desiredRequest : null;

          if (queuedRequest?.target === request.target) {
            desiredRequest = null;
          }

          if (queuedRequest && queuedRequest.target !== request.target) {
            renderIntroButtons();
            renderButtons();
            reconcileExperience();
            return;
          }

          if (!introOpen) {
            showStatus(message, true);
          }

          renderIntroButtons();
          renderButtons();
        };

        const startExperienceChange = (request) => {
          const currentRequest = {
            ...request,
            id: ++requestSequence,
            timeoutId: null,
          };

          inFlight = currentRequest;
          currentRequest.timeoutId = window.setTimeout(() => {
            failExperienceChange(
              currentRequest.id,
              new Error("The experience took too long to start."),
            );
          }, EXPERIENCE_CHANGE_TIMEOUT);

          if (currentRequest.source === "pill") {
            showStatus(
              `Switching to ${experienceLabels[currentRequest.target]}…`,
              false,
              true,
            );
          }

          renderIntroButtons();
          renderButtons();

          try {
            const result = experienceCalls[currentRequest.target]();
            if (result && typeof result.then === "function") {
              Promise.resolve(result).catch((changeError) => {
                failExperienceChange(currentRequest.id, changeError);
              });
            }
          } catch (changeError) {
            failExperienceChange(currentRequest.id, changeError);
          }
        };

        function reconcileExperience() {
          if (sdkPhase !== "ready" || !desiredRequest || inFlight) return;

          const request = desiredRequest;
          if (request.cycle !== flowCycle) {
            desiredRequest = null;
            return;
          }

          desiredRequest = null;

          if (
            experienceOpen &&
            activeExperience === request.target
          ) {
            completeRequest(request);
            renderIntroButtons();
            renderButtons();
            return;
          }

          startExperienceChange(request);
        }

        const requestExperience = (target, source) => {
          if (!experienceCalls[target] || sdkPhase === "fatal") return;

          if (source === "intro") {
            introChoice = target;
          }

          desiredRequest = {
            target,
            source,
            cycle: flowCycle,
          };

          renderIntroButtons();
          if (source === "intro") showExperienceView();
          reconcileExperience();
        };

        introButtons.forEach((button) => {
          button.addEventListener("click", () => {
            if (!introOpen) return;
            requestExperience(button.dataset.introExperience, "intro");
          });
        });

        buttons.forEach((button) => {
          button.addEventListener("click", () => {
            const target = button.dataset.experience;
            if (
              introOpen ||
              sdkPhase !== "ready" ||
              inFlight ||
              !experienceCalls[target]
            ) {
              return;
            }

            requestExperience(target, "pill");
          });
        });

        setExperienceUiVisible(false);
        setLoaderVisible(false);
        renderIntroButtons();
        renderButtons();

        if (!glamar) {
          showFatalError(
            "The GlamAR experience could not be loaded. Please try again.",
          );
          return;
        }

        const config = {
          platform: "web",
          mode: "private",
          meta: {
            sdkVersion: version || "2.0.0",
            debugText,
            preloadMLModels: ["face", "hair", "hand", "light"],
            ...(cameraSync !== null && {
              disableCameraSync: cameraSync === "true",
            }),
          },
        };

        try {
          /*
           * GlamAR.init() recreates the wrapper's internal event emitter.
           * Register our listeners immediately after init returns so they
           * attach to the emitter that will receive iframe events.
           */
          const initResult = glamar.init("GlamAR-module", accessKey, config);

          glamar.addEventListener("loading", () => {
            if (sdkPhase === "fatal") return;
            sdkLoading = true;
            setLoaderVisible(true);
            if (!introOpen) setExperienceUiVisible(true, false);
            renderButtons();
          });

          glamar.addEventListener("loaded", () => {
            sdkLoading = false;
            if (sdkPhase === "fatal") return;

            const isFirstLoadedEvent = !firstLoadedHandled;
            if (isFirstLoadedEvent) {
              firstLoadedHandled = true;
              sdkPhase = "ready";
            }

            setLoaderVisible(false);
            if (!introOpen) setExperienceUiVisible(true, true);
            renderButtons();
            if (!isFirstLoadedEvent) return;

            renderIntroButtons();

            if (!desiredRequest) {
              desiredRequest = {
                target: introChoice || "makeup",
                source: introChoice ? "intro" : "default",
                cycle: flowCycle,
              };
            }

            reconcileExperience();
          });

          glamar.addEventListener("experience-changing", (event) => {
            console.info("GlamAR experience-changing:", event);
          });

          glamar.addEventListener("experience-changed", (event) => {
            console.info("GlamAR experience-changed:", event);

            const request = inFlight;
            if (!request || request.cycle !== flowCycle) return;

            if (!matchesExperienceEvent(event, request.target)) {
              console.warn(
                "Ignoring an out-of-order GlamAR experience event:",
                event,
              );
              return;
            }

            window.clearTimeout(request.timeoutId);
            inFlight = null;
            activeExperience = request.target;
            experienceOpen = true;
            sdkLoading = false;
            setLoaderVisible(false);
            if (!introOpen) setExperienceUiVisible(true, true);

            if (!desiredRequest) completeRequest(request);

            renderIntroButtons();
            renderButtons();
            reconcileExperience();
          });

          glamar.addEventListener("experience-change-failed", (event) => {
            console.error("GlamAR experience-change-failed:", event);
            if (!inFlight) return;

            if (!matchesExperienceEvent(event, inFlight.target)) {
              console.warn(
                "Ignoring an out-of-order GlamAR experience failure:",
                event,
              );
              return;
            }

            failExperienceChange(inFlight.id, event);
          });

          glamar.addEventListener("closed", (event) => {
            console.info("GlamAR closed:", event);
            const isIdleIntro =
              introOpen &&
              !experienceOpen &&
              !inFlight;
            if (isIdleIntro) return;

            flowCycle += 1;
            if (inFlight?.timeoutId) {
              window.clearTimeout(inFlight.timeoutId);
            }

            inFlight = null;
            desiredRequest = null;
            experienceOpen = false;
            activeExperience = null;
            sdkLoading = false;
            showIntro();
          });

          glamar.addEventListener("error", (event) => {
            const message = getErrorMessage(event);

            if (sdkPhase !== "ready") {
              showFatalError(
                message ||
                  "The experience could not be started. Please try again.",
              );
              return;
            }

            console.warn("GlamAR runtime error:", message || event);
          });

          if (initResult && typeof initResult.then === "function") {
            Promise.resolve(initResult).catch((initError) => {
              if (sdkPhase === "ready") {
                console.warn("GlamAR initialization warning:", initError);
                return;
              }

              showFatalError(
                getErrorMessage(initError) ||
                  "The experience could not be started. Please try again.",
              );
            });
          }
        } catch (initError) {
          showFatalError(
            getErrorMessage(initError) ||
              "The experience could not be started. Please try again.",
          );
        }
      })();
    </script>
  </body>
</html>
