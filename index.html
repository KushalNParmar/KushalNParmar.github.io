<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>GlamAR experience switcher</title>
    <style>
      :root {
        color-scheme: light;
        --control-bg: rgba(19, 20, 23, 0.88);
        --control-border: rgba(255, 255, 255, 0.16);
        --control-text: rgba(255, 255, 255, 0.72);
        --control-active: #fff;
        --accent: #f4f4f4;
        --error: #ffb4ab;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        font-size: 1vw;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        font-family: Inter, sans-serif;
      }

      button {
        font: inherit;
      }

      #GlamAR-module {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .experience-controls {
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        left: 50%;
        z-index: 20;
        display: grid;
        grid-template-columns: repeat(3, minmax(76px, 1fr));
        gap: 4px;
        width: min(340px, calc(100vw - 28px));
        padding: 5px;
        overflow: hidden;
        border: 1px solid var(--control-border);
        border-radius: 999px;
        background: var(--control-bg);
        box-shadow:
          0 14px 38px rgba(0, 0, 0, 0.2),
          inset 0 1px rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        transform: translateX(-50%);
      }

      .experience-button {
        min-height: 38px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--control-text);
        cursor: pointer;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.02em;
        transition:
          color 160ms ease,
          background-color 160ms ease,
          opacity 160ms ease,
          transform 160ms ease;
      }

      .experience-button:hover:not(:disabled) {
        color: var(--control-active);
        transform: translateY(-1px);
      }

      .experience-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .experience-button.is-active {
        background: var(--accent);
        color: #171914;
      }

      .experience-button.is-pending {
        background: rgba(255, 255, 255, 0.12);
        color: var(--control-active);
      }

      .experience-button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      .experience-status {
        position: fixed;
        top: max(68px, calc(env(safe-area-inset-top) + 54px));
        left: 50%;
        z-index: 20;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 7px 11px;
        border-radius: 8px;
        background: rgba(19, 20, 23, 0.82);
        color: #fff;
        font-size: 12px;
        line-height: 1.35;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -4px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .experience-status.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .experience-status.is-error {
        color: var(--error);
      }

      .centeredLoader {
        position: fixed;
        display: flex;
        width: 100%;
        height: 100%;
        background: var(--layout-background-color);
        justify-content: center;
        align-items: center;
        z-index: 5000;
        background: #fff;
      }

      .centeredLoader[hidden] {
        display: none;
      }

      .lottieContainer {
        display: flex;
        padding: 7.5rem;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.25rem;
        flex-shrink: 0;
      }

      .waveGrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        width: 20rem;
        height: 20rem;
        flex-shrink: 0;
        aspect-ratio: 1 / 1;
      }

      .waveGrid .cell {
        width: 100%;
        height: 100%;
        background: #000;
        transform: scale(0.4);
        transform-origin: center;
        will-change: transform;
        animation: waveScale 1.57s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        box-shadow: 0 0 0 0.5px #000;
      }

      @keyframes waveScale {
        0% {
          transform: scale(0.4);
        }

        21% {
          transform: scale(1);
        }

        53% {
          transform: scale(1);
        }

        75% {
          transform: scale(0.4);
        }

        100% {
          transform: scale(0.4);
        }
      }

      .waveGrid .cell:nth-child(1) {
        animation-delay: 200ms;
      }

      .waveGrid .cell:nth-child(2) {
        animation-delay: 267ms;
      }

      .waveGrid .cell:nth-child(3) {
        animation-delay: 334ms;
      }

      .waveGrid .cell:nth-child(4) {
        animation-delay: 400ms;
      }

      .waveGrid .cell:nth-child(5) {
        animation-delay: 133ms;
      }

      .waveGrid .cell:nth-child(6) {
        animation-delay: 200ms;
      }

      .waveGrid .cell:nth-child(7) {
        animation-delay: 267ms;
      }

      .waveGrid .cell:nth-child(8) {
        animation-delay: 334ms;
      }

      .waveGrid .cell:nth-child(9) {
        animation-delay: 67ms;
      }

      .waveGrid .cell:nth-child(10) {
        animation-delay: 133ms;
      }

      .waveGrid .cell:nth-child(11) {
        animation-delay: 200ms;
      }

      .waveGrid .cell:nth-child(12) {
        animation-delay: 267ms;
      }

      .waveGrid .cell:nth-child(13) {
        animation-delay: 0ms;
      }

      .waveGrid .cell:nth-child(14) {
        animation-delay: 67ms;
      }

      .waveGrid .cell:nth-child(15) {
        animation-delay: 133ms;
      }

      .waveGrid .cell:nth-child(16) {
        animation-delay: 200ms;
      }

      .lottieText {
        margin: 0;
        text-align: center;
        font-size: 3.75rem;
        font-style: normal;
        font-weight: 400;
      }

      #error {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        place-items: center;
        padding: 24px;
        background: #fff;
        color: #b42318;
        text-align: center;
        line-height: 1.5;
      }

      #error.is-visible {
        display: grid;
      }

      @media (min-width: 648px) {
        .lottieContainer {
          padding: 3.7rem;
          gap: 0.62rem;
        }

        .waveGrid {
          width: 12.35rem;
          height: 12.35rem;
        }

        .lottieText {
          font-size: 2.16rem;
        }
      }

      @media (min-width: 720px) and (orientation: landscape) {
        .lottieContainer {
          padding: 3.33rem;
          gap: 0.56rem;
        }

        .waveGrid {
          width: 11.11rem;
          height: 11.11rem;
        }

        .lottieText {
          font-size: 1.94rem;
        }
      }

      @media (min-width: 846px) and (orientation: portrait) {
        .lottieContainer {
          padding: 2.84rem;
          gap: 0.47rem;
        }

        .waveGrid {
          width: 14.18rem;
          height: 14.18rem;
        }

        .lottieText {
          font-size: 2.36rem;
        }
      }

      @media (min-width: 1440px) and (orientation: landscape) {
        .lottieContainer {
          padding: 1.67rem;
          gap: 0.28rem;
        }

        .waveGrid {
          width: 8.33rem;
          height: 8.33rem;
        }

        .lottieContainer h4 {
          font-size: 1.39rem;
        }
      }

      @media (min-width: 1080px) and (orientation: portrait) {
        .lottieContainer {
          padding: 2.22rem;
          gap: 0.37rem;
        }

        .waveGrid {
          width: 14.81rem;
          height: 14.81rem;
        }

        .lottieContainer h4 {
          font-size: 2.22rem;
        }
      }

      @media (min-width: 1920px) and (orientation: landscape) {
        .lottieContainer {
          padding: 1.25rem;
          gap: 0.21rem;
        }

        .waveGrid {
          width: 8.33rem;
          height: 8.33rem;
        }

        .lottieContainer h4 {
          font-size: 1.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .experience-button,
        .experience-status {
          transition: none;
        }

        .waveGrid .cell {
          animation: none;
          transform: scale(1);
        }
      }
    </style>
    <script src="https://cdn.glamarz0.de/sdk/wrapper?"></script>
  </head>
  <body>
    <main id="GlamAR-module"></main>

    <nav class="experience-controls" aria-label="Switch GlamAR experience">
      <button
        class="experience-button is-active"
        data-experience="makeup"
        type="button"
        disabled
      >
        Makeup
      </button>
      <button
        class="experience-button"
        data-experience="hair"
        type="button"
        disabled
      >
        Hair
      </button>
      <button
        class="experience-button"
        data-experience="skin"
        type="button"
        disabled
      >
        Skin
      </button>
    </nav>
    <p
      id="experience-status"
      class="experience-status"
      role="status"
      aria-live="polite"
    ></p>

    <div class="centeredLoader" id="lottieLoader" role="status">
      <div class="lottieContainer">
        <div class="waveGrid" aria-hidden="true">
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
        </div>
        <h4 class="lottieText">Loading your experience</h4>
      </div>
    </div>
    <div id="error" role="alert"></div>

    <script>
      (() => {
        const DEFAULT_API_KEY = "25cd4d7a-fe7d-4fc4-af1b-608414bf0c99";
        const SKIN_ANALYSIS_APP_ID = "0732f85d-5768-462e-a50a-174840438a69";
        const params = new URLSearchParams(window.location.search);
        const accessKey = params.get("accessKey") || DEFAULT_API_KEY;
        const version = params.get("version");
        const debugText = params.get("debug") === "true";
        const cameraSync = params.get("cameraSync");
        const lottieLoader = document.getElementById("lottieLoader");
        const error = document.getElementById("error");
        const status = document.getElementById("experience-status");
        const buttons = Array.from(
          document.querySelectorAll("[data-experience]"),
        );
        let sdkLoaded = false;
        let pendingExperience = null;
        let activeExperience = "makeup";
        let statusTimer = null;

        const experienceCalls = {
          makeup: () =>
            GlamAR.setExperience("vto", {
              category: "makeup",
            }),
          hair: () =>
            GlamAR.setExperience("vto", {
              category: "hair",
            }),
          skin: () =>
            GlamAR.setExperience("skinAnalysis", {
              appId: SKIN_ANALYSIS_APP_ID,
            }),
        };

        const getErrorMessage = (event) => {
          if (typeof event === "string") return event;
          return event?.error || event?.message;
        };

        const setButtonsDisabled = (disabled) => {
          buttons.forEach((button) => {
            button.disabled = disabled;
          });
        };

        const renderButtons = () => {
          buttons.forEach((button) => {
            const experience = button.dataset.experience;
            button.classList.toggle(
              "is-active",
              experience === activeExperience && !pendingExperience,
            );
            button.classList.toggle(
              "is-pending",
              experience === pendingExperience,
            );
            button.setAttribute(
              "aria-pressed",
              String(experience === activeExperience),
            );
          });
        };

        const showStatus = (message, isError = false, persistent = false) => {
          window.clearTimeout(statusTimer);
          status.textContent = message;
          status.classList.toggle("is-error", isError);
          status.classList.toggle("is-visible", Boolean(message));
          if (message && !persistent) {
            statusTimer = window.setTimeout(() => {
              status.classList.remove("is-visible");
            }, 2200);
          }
        };

        const showError = (message) => {
          lottieLoader.hidden = true;
          error.textContent = message;
          error.classList.add("is-visible");
          setButtonsDisabled(true);
        };

        const finishExperienceChange = () => {
          pendingExperience = null;
          setButtonsDisabled(!sdkLoaded);
          renderButtons();
        };

        buttons.forEach((button) => {
          button.addEventListener("click", () => {
            const experience = button.dataset.experience;
            if (
              !sdkLoaded ||
              pendingExperience ||
              !experienceCalls[experience]
            ) {
              return;
            }

            pendingExperience = experience;
            setButtonsDisabled(true);
            renderButtons();
            showStatus(
              `Switching to ${button.textContent.trim()}…`,
              false,
              true,
            );
            experienceCalls[experience]();
          });
        });

        if (!window.GlamAR) {
          showError(
            "The GlamAR experience could not be loaded. Please try again.",
          );
          return;
        }

        const config = {
          platform: "web",
          mode: "private",
          // category: "makeup",
          // configuration: {
          //   skinAnalysis: {
          //     appId: SKIN_ANALYSIS_APP_ID
          //   }
          // },

          meta: {
            sdkVersion: version || "2.0.0",
            debugText,
            preloadMLModels: ["face", "hair", "hand", "light"],
            ...(cameraSync !== null && {
              disableCameraSync: cameraSync === "true",
            }),
          },
        };

        try {
          GlamAR.init("GlamAR-module", accessKey, config);

          GlamAR.addEventListener("loading", () => {
            lottieLoader.hidden = false;
          });

          GlamAR.addEventListener("loaded", () => {
            sdkLoaded = true;
            lottieLoader.hidden = true;
            setButtonsDisabled(false);
            renderButtons();
            GlamAR.setExperience("vto", {
              category: "makeup",
            });
          });

          GlamAR.addEventListener("experience-changing", (event) => {
            console.info("GlamAR experience-changing:", event);
          });

          GlamAR.addEventListener("experience-changed", (event) => {
            console.info("GlamAR experience-changed:", event);
            if (pendingExperience) {
              activeExperience = pendingExperience;
            } else if (event?.experience === "skinAnalysis") {
              activeExperience = "skin";
            }
            finishExperienceChange();
            showStatus("Experience switched");
          });

          GlamAR.addEventListener("experience-change-failed", (event) => {
            console.error("GlamAR experience-change-failed:", event);
            const message =
              getErrorMessage(event) || "Experience switch failed";
            finishExperienceChange();
            showStatus(message, true);
          });

          GlamAR.addEventListener("error", (event) => {
            const message = getErrorMessage(event);

            if (!sdkLoaded) {
              showError(
                message ||
                  "The experience could not be started. Please try again.",
              );
              return;
            }

            console.warn("GlamAR runtime error:", message || event);
          });
        } catch (initError) {
          showError("The experience could not be started. Please try again.");
        }
      })();
    </script>
  </body>
</html>
